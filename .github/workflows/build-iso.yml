name: Build AetherOS Live ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space on Runner
        run: |
          echo "==> Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/lib/jvm
          sudo docker image prune --all --force
          echo "==> Disk space after cleanup:"
          df -h /

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build ISO in Privileged Arch Linux Container
        run: |
          mkdir -p out
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            archlinux:latest \
            /bin/bash -c "
              set -e
              echo '==> Updating keyrings and installing archiso...'
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm git archiso
              
              echo '==> Building AetherOS ISO with mkarchiso...'
              mkdir -p /build-work
              mkarchiso -v -w /build-work -o /workspace/out /workspace
            "

      - name: Generate Checksums
        run: |
          cd out
          sha256sum *.iso > sha256sum.txt
          cat sha256sum.txt
          ls -lh

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheros-live-iso
          path: |
            out/*.iso
            out/sha256sum.txt
          retention-days: 7

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/sha256sum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
