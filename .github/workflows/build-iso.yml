name: Build AetherOS Live ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Install Git & Core Build Tools
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm git archiso

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Safe Directory for Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build ISO via mkarchiso
        run: |
          mkdir -p /tmp/work /tmp/out
          mkarchiso -v -w /tmp/work -o /tmp/out .

      - name: Generate Checksums
        run: |
          cd /tmp/out
          sha256sum *.iso > sha256sum.txt
          cat sha256sum.txt

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheros-live-iso
          path: |
            /tmp/out/*.iso
            /tmp/out/sha256sum.txt
          retention-days: 7

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /tmp/out/*.iso
            /tmp/out/sha256sum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
