name: Build AetherOS Live ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build-arm64:
    name: Build AetherOS ARM64 ISO (VMware Fusion / Apple Silicon)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Free Disk Space on Runner
        run: |
          echo "==> Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/lib/jvm
          sudo docker image prune --all --force
          echo "==> Disk space after cleanup:"
          df -h /

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build ARM64 ISO in Privileged Arch Linux ARM Container
        run: |
          mkdir -p out
          chmod +x scripts/build-arm64-container.sh
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            agners/archlinuxarm:latest \
            /workspace/scripts/build-arm64-container.sh

      - name: Split ISO and Prepare Release Assets
        run: |
          cd out
          echo "==> Splitting ARM64 ISO into 1500M parts (< 2 GB for GitHub Releases)..."
          for iso in *.iso; do
            [ -f "$iso" ] || continue
            split -b 1500M -d "$iso" "${iso}.part"
          done

          echo "==> Generating SHA256 checksums..."
          sha256sum *.iso > sha256sum-arm64.txt
          sha256sum *.iso.part* >> sha256sum-arm64.txt
          cp -f sha256sum-arm64.txt sha256sum.txt

          echo "==> Copying combine scripts..."
          cp ../scripts/combine.sh .
          cp ../scripts/combine.bat .
          cp ../scripts/combine.py .
          chmod +x combine.sh combine.py

          echo "==> Prepared ARM64 output files:"
          ls -lh
          cat sha256sum.txt

      - name: Upload ARM64 ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheros-arm64-live-iso
          path: |
            out/*.iso
            out/*.iso.part*
            out/sha256sum.txt
            out/combine.sh
            out/combine.bat
            out/combine.py
          retention-days: 7

  build-x86_64:
    name: Build AetherOS x86_64 ISO (PC / Intel / AMD)
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space on Runner
        run: |
          echo "==> Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/lib/jvm
          sudo docker image prune --all --force
          echo "==> Disk space after cleanup:"
          df -h /

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build x86_64 ISO in Privileged Arch Linux Container
        run: |
          mkdir -p out
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            archlinux:latest \
            /bin/bash -c "
              set -e
              echo '==> Updating keyrings and installing archiso...'
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm git archiso
              
              echo '==> Building AetherOS ISO with mkarchiso...'
              mkdir -p /build-work
              mkarchiso -v -w /build-work -o /workspace/out /workspace
            "

      - name: Split ISO and Prepare Release Assets
        run: |
          cd out
          echo "==> Splitting x86_64 ISO into 1500M parts (< 2 GB for GitHub Releases)..."
          for iso in *.iso; do
            [ -f "$iso" ] || continue
            split -b 1500M -d "$iso" "${iso}.part"
          done

          echo "==> Generating SHA256 checksums..."
          sha256sum *.iso > sha256sum-x86_64.txt
          sha256sum *.iso.part* >> sha256sum-x86_64.txt
          cp -f sha256sum-x86_64.txt sha256sum.txt

          echo "==> Copying combine scripts..."
          cp ../scripts/combine.sh .
          cp ../scripts/combine.bat .
          cp ../scripts/combine.py .
          chmod +x combine.sh combine.py

          echo "==> Prepared x86_64 output files:"
          ls -lh
          cat sha256sum.txt

      - name: Upload x86_64 ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheros-live-iso
          path: |
            out/*.iso
            out/*.iso.part*
            out/sha256sum.txt
            out/combine.sh
            out/combine.bat
            out/combine.py
          retention-days: 7

  publish-release:
    name: Publish Split ISO Release to GitHub Releases
    needs: [build-arm64, build-x86_64]
    if: always() && (needs.build-arm64.result == 'success' || needs.build-x86_64.result == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: "aetheros*"
          merge-multiple: true

      - name: Consolidate Split Parts and Checksums
        run: |
          mkdir -p release-assets
          cd downloaded-artifacts

          echo "==> Moving split parts under 2 GB to release directory..."
          mv -f *.iso.part* ../release-assets/ 2>/dev/null || true

          cd ../release-assets
          echo "==> Copying merge tools..."
          cp ../scripts/combine.sh .
          cp ../scripts/combine.bat .
          cp ../scripts/combine.py .
          chmod +x combine.sh combine.py

          echo "==> Generating consolidated sha256sum.txt..."
          # Rebuild checksum file from all split parts and all artifact checksums
          cat ../downloaded-artifacts/sha256sum*.txt 2>/dev/null | sort -u > sha256sum.txt || true
          if [ ! -s sha256sum.txt ]; then
            sha256sum *.iso.part* > sha256sum.txt
          fi

          echo "==> Release assets list:"
          ls -lh
          cat sha256sum.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('AetherOS Release {0}', github.ref_name) || 'AetherOS Rolling Release (Latest)' }}
          body: |
            ## AetherOS Live ISO Release (KDE Plasma 6)

            ### How to Combine the Split Parts (< 2 GB each)
            GitHub Releases limits file sizes to 2 GB. The AetherOS ISOs are distributed in parts (`.iso.part00`, `.iso.part01`, etc.).
            
            Download all `.part*` files for your architecture, `sha256sum.txt`, and the merge script for your OS into the **same folder**:

            #### On macOS / Linux:
            ```bash
            chmod +x combine.sh
            ./combine.sh
            ```

            #### On Windows:
            Double-click `combine.bat` or run:
            ```cmd
            combine.bat
            ```

            #### Using Python (Cross-Platform: Windows / macOS / Linux):
            ```bash
            python3 combine.py
            ```

            The script automatically verifies each part's SHA256 checksum, concatenates the parts into the full `.iso`, and verifies the complete ISO against `sha256sum.txt`.
          files: |
            release-assets/*.iso.part*
            release-assets/sha256sum.txt
            release-assets/combine.sh
            release-assets/combine.bat
            release-assets/combine.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
