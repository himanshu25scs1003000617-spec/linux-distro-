#
# /etc/pacman.conf - Pacman Configuration for AetherOS ARM64 (aarch64) ISO Build
#

[options]
HoldPkg     = pacman glibc
Architecture = aarch64
Color
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Arch Linux ARM (ALARM) Repositories
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist

# Local repository for Calamares GUI installer on aarch64
[custom]
SigLevel = Optional TrustAll
Server = file:///workspace/custom-pkgs/aarch64
