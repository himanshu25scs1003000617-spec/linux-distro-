#
# /etc/pacman.conf - Pacman Configuration for AetherOS ARM64 (aarch64) ISO Build
#

[options]
HoldPkg     = pacman glibc
Architecture = aarch64
Color
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Arch Linux ARM (ALARM) Repositories
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist

# Extra repositories providing Calamares GUI installer and hardware utilities for aarch64
[manjaro-extra]
SigLevel = Optional TrustAll
Server = https://mirror.math.princeton.edu/pub/manjaro/arm-testing/extra/$arch
Server = https://mirror.easyname.at/manjaro/arm-stable/extra/$arch

[endeavouros]
SigLevel = Optional TrustAll
Server = https://mirror.alpix.eu/endeavouros/repo/$repo/$arch
