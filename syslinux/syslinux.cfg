DEFAULT aetheros
PROMPT 0
TIMEOUT 150

UI vesamenu.c32
MENU TITLE AetherOS Linux Boot Menu

LABEL aetheros
    MENU LABEL AetherOS Live (x86_64, BIOS)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=4G copytoram=n quiet splash

LABEL reboot
    MENU LABEL Reboot System
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL Power Off
    COM32 poweroff.c32
