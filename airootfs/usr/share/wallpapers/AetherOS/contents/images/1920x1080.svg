<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%" fx="50%" fy="45%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="45%" stop-color="#0b0e17"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>

    <!-- Emerald Glow -->
    <radialGradient id="emeraldGlow" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#00d8b4" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#00b4d8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Accent -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#4361ee"/>
    </linearGradient>

    <!-- Soft Grid Pattern -->
    <pattern id="cyberGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#00d8b4" stroke-width="0.75" stroke-opacity="0.04"/>
    </pattern>

    <!-- Filter for glow effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Subtle Cyber Grid -->
  <rect width="1920" height="1080" fill="url(#cyberGrid)"/>

  <!-- Ambient Emerald Light Dome -->
  <circle cx="960" cy="520" r="650" fill="url(#emeraldGlow)"/>

  <!-- Futuristic Geometric Circuit Lines -->
  <g stroke="url(#cyanAccent)" stroke-width="1.5" stroke-opacity="0.25" fill="none">
    <path d="M 200 900 L 450 650 L 750 650 L 900 500"/>
    <circle cx="200" cy="900" r="4" fill="#00f5d4" opacity="0.5"/>
    <circle cx="750" cy="650" r="3" fill="#00bbf9" opacity="0.4"/>

    <path d="M 1720 180 L 1480 420 L 1200 420 L 1050 540"/>
    <circle cx="1720" cy="180" r="4" fill="#00d8b4" opacity="0.5"/>
    <circle cx="1200" cy="420" r="3" fill="#00f5d4" opacity="0.4"/>

    <path d="M 300 200 L 500 200 L 650 350 L 800 350"/>
    <path d="M 1600 900 L 1400 900 L 1250 750 L 1100 750"/>
  </g>

  <!-- Central Modern Logo Emblem -->
  <g transform="translate(960, 480)" filter="url(#glow)">
    <!-- Outer Hex Shield -->
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="url(#cyanAccent)" stroke-width="3" opacity="0.75"/>
    <polygon points="0,-75 65,-37 65,37 0,75 -65,37 -65,-37" fill="#0c101c" stroke="#00d8b4" stroke-width="1.5" opacity="0.85"/>

    <!-- Inner 'A' Glyph -->
    <path d="M 0 -45 L 35 30 L 18 30 L 0 -12 L -18 30 L -35 30 Z" fill="url(#cyanAccent)"/>
    <polygon points="0,-6 14,24 -14,24" fill="#0c101c"/>
  </g>

  <!-- Typography -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="960" y="625" font-size="34" font-weight="700" letter-spacing="8" fill="#f0f4fc">AETHER<tspan fill="#00d8b4">OS</tspan></text>
    <text x="960" y="660" font-size="13" font-weight="500" letter-spacing="5" fill="#64748b" text-transform="uppercase">Next-Gen Arch Experience</text>
  </g>
</svg>
