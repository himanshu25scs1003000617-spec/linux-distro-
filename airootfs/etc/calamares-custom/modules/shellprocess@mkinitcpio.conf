#
# Calamares shellprocess module to run mkinitcpio on the target system
---

dontChroot: false

timeout: 300

script:
    - "sh -c 'if [ -f /etc/mkinitcpio.d/linux-aarch64.preset ] && [ ! -f /etc/mkinitcpio.d/linux.preset ]; then cp -f /etc/mkinitcpio.d/linux-aarch64.preset /etc/mkinitcpio.d/linux.preset; fi'"
    - "mkinitcpio -P"
    - "sh -c 'if [ -f /boot/Image ] && [ ! -f /boot/vmlinuz-linux ]; then cp -f /boot/Image /boot/vmlinuz-linux; fi'"
    - "sh -c 'if [ -f /boot/vmlinuz-linux ] && [ ! -f /boot/Image ]; then cp -f /boot/vmlinuz-linux /boot/Image; fi'"
    - "sh -c 'if [ -f /boot/initramfs-linux-aarch64.img ] && [ ! -f /boot/initramfs-linux.img ]; then cp -f /boot/initramfs-linux-aarch64.img /boot/initramfs-linux.img; fi'"
    - "sh -c 'if [ -f /boot/initramfs-linux.img ] && [ ! -f /boot/initramfs-linux-aarch64.img ]; then cp -f /boot/initramfs-linux.img /boot/initramfs-linux-aarch64.img; fi'"
    - "sh -c 'if [ -d /boot/efi/EFI ]; then mkdir -p /boot/efi/EFI/BOOT; cp -f /boot/efi/EFI/*/*.efi /boot/efi/EFI/BOOT/BOOTAA64.EFI 2>/dev/null || true; cp -f /boot/efi/EFI/*/*.efi /boot/efi/EFI/BOOT/BOOTX64.EFI 2>/dev/null || true; fi'"


i18n:
    name: "Generating initial ramdisk (mkinitcpio)..."
