# /etc/sysctl.d/99-aether-gaming.conf - CachyOS-Grade Gaming & Runtime Sysctl Tweaks

# Essential for memory-mapped games (Star Citizen, DayZ, Hogwarts Legacy) and Wine/Proton
vm.max_map_count = 2147483642

# Keep gaming assets in RAM, avoid aggressive disk swapping
vm.swappiness = 10

# CAKE queue discipline to eliminate bufferbloat and network jitter
net.core.default_qdisc = cake

# Google BBR congestion control for smooth multiplayer network packet streaming
net.ipv4.tcp_congestion_control = bbr

# Increase network buffer limits for high-speed downloads & streaming
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
